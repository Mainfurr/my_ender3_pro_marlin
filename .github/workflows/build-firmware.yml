name: Build printer firmware

on:
  push:
    branches:
    - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install PlatformIO
      run: pip install -U platformio
    - name: Build STM32G0B1RE_btt (SKR Mini E3 V3.0)
      run: |
        export PLATFORMIO_BUILD_FLAGS="-DMF_GIT_REV=\\\"${GITHUB_SHA::7}\\\" -DMF_BUILD_DATE=\\\"$(date -u +%F)\\\""
        pio run -e STM32G0B1RE_btt
    - name: Checksum
      run: |
        cp .pio/build/STM32G0B1RE_btt/firmware.bin firmware.bin
        sha256sum firmware.bin | tee SHA256SUMS
    - uses: actions/upload-artifact@v4
      with:
        name: firmware-STM32G0B1RE_btt
        path: |
          firmware.bin
          SHA256SUMS
    # Artifact downloads are blocked for the build host, so also commit the
    # binary to the firmware-builds branch, where git fetch can reach it.
    - name: Publish to firmware-builds branch
      run: |
        dir="$GITHUB_REF_NAME"
        mkdir -p /tmp/out/"$dir"
        cp firmware.bin SHA256SUMS /tmp/out/"$dir"/
        echo "$GITHUB_SHA" > /tmp/out/"$dir"/SOURCE_COMMIT
        git config user.name "github-actions[bot]"
        git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
        if git fetch origin firmware-builds; then
          git checkout -B firmware-builds origin/firmware-builds
        else
          git checkout --orphan firmware-builds
          git rm -rfq .
        fi
        git clean -fdxq
        cp -r /tmp/out/. .
        git add -A
        git commit -m "Firmware for $dir @ ${GITHUB_SHA::7}" || exit 0
        git push origin firmware-builds
